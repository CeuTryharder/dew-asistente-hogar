<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="55%" stop-color="#0B1528"/>
      <stop offset="100%" stop-color="#063B32"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado Obsidiana Orca -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>

  <!-- Retícula cibernética -->
  <g stroke="#38BDF8" stroke-opacity="0.12" stroke-width="2">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>

  <!-- Anillo exterior de energía -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#10B981" stroke-opacity="0.28" stroke-width="5"/>

  <!-- Silueta de Hogar Inteligente (Tejado Hexagonal) -->
  <path d="M256 88 L398 198 L398 380 C398 398 384 412 366 412 L146 412 C128 412 114 398 114 380 L114 198 Z"
        fill="#38BDF8" fill-opacity="0.09" stroke="#38BDF8" stroke-width="11" stroke-linejoin="round"/>

  <!-- Gota Central Dew (Rocío IA) -->
  <path d="M256 120 C256 120 162 232 162 302 C162 354 204 396 256 396 C308 396 350 354 350 302 C350 232 256 120 256 120 Z"
        fill="url(#dropGrad)"/>

  <!-- Consola Terminal Orca (>_) en el núcleo de la gota -->
  <rect x="192" y="242" width="128" height="106" rx="22" fill="#090D16" stroke="#A7F3D0" stroke-width="6"/>
  <path d="M214 274 L244 296 L214 318" fill="none" stroke="#10B981" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="256" y1="318" x2="294" y2="318" stroke="#F59E0B" stroke-width="13" stroke-linecap="round"/>

  <!-- Destello <think> superior -->
  <path d="M256 158 L264 182 L288 190 L264 198 L256 222 L248 198 L224 190 L248 182 Z" fill="#FFFFFF"/>
</svg>

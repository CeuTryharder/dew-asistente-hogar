name: Build Android APK (RedMagic Astra 16GB & Mobile)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Nativa Android (arm64-v8a / JNI C++)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio Dew
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK, CMake 3.22.1 y NDK para el puente C++ JNI
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;26.1.10909125"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ejecutar Suite de Pruebas Internas JVM (Domótica, Hacienda, Despensa, Motor Abierto) y Compilar APK
        run: |
          gradle :android_app:testDebugUnitTest :android_app:assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK generada
        run: |
          cp android_app/build/outputs/apk/debug/android_app-debug.apk dew-hogar-redmagic-16gb-debug.apk

      - name: Subir APK lista para instalar en Tablet / Móvil
        uses: actions/upload-artifact@v4
        with:
          name: dew-hogar-redmagic-16gb-debug-apk
          path: dew-hogar-redmagic-16gb-debug.apk
          retention-days: 30
